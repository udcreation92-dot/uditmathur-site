<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Drag-to-Summarize settings</title>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; max-width: 520px; margin: 32px auto; padding: 0 16px; color: #0f172a; }
    h1 { font-size: 20px; }
    p { color: #475569; font-size: 14px; line-height: 1.5; }
    label { display: block; margin: 16px 0 4px; font-size: 13px; font-weight: 600; }
    input, select { width: 100%; padding: 8px 10px; font-size: 14px; border: 1px solid #cbd5e1; border-radius: 8px; }
    button { margin-top: 20px; padding: 9px 18px; font-size: 14px; font-weight: 600; color: #fff; background: #2563eb; border: 0; border-radius: 8px; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    #status { margin-left: 10px; color: #16a34a; font-size: 13px; }
    .hint { font-size: 12px; color: #64748b; margin-top: 4px; }
  </style>
</head>
<body>
  <h1>Drag-to-Summarize</h1>
  <p>Drag any link to the blue bar at the top of a page to get a DeepSeek summary of the linked article. Your API key is stored locally in this browser and only sent to DeepSeek.</p>

  <label for="key">DeepSeek API key</label>
  <input id="key" type="password" placeholder="sk-..." autocomplete="off" />
  <div class="hint">From platform.deepseek.com → API keys.</div>

  <label for="model">Model</label>
  <select id="model">
    <option value="deepseek-chat">deepseek-chat (fast, cheap)</option>
    <option value="deepseek-reasoner">deepseek-reasoner (slower, pricier)</option>
  </select>

  <label for="length">Summary length</label>
  <select id="length">
    <option value="short">Short (2-3 sentences)</option>
    <option value="medium" selected>Medium (TL;DR + bullets)</option>
    <option value="detailed">Detailed (TL;DR + more bullets)</option>
  </select>

  <label for="language">Summary language</label>
  <input id="language" value="English" />

  <div><button id="save">Save</button><span id="status"></span></div>

  <script src="options.js"></script>
</body>
</html>
